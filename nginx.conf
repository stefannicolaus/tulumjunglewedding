server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json image/webp;
    gzip_vary on;
    gzip_min_length 256;

    # HTML: always fresh
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # JS + CSS: 1 day (Astro content hash in filename)
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Images + fonts: no-cache (browser revalidates via ETag)
    location ~* \.(png|jpg|jpeg|gif|svg|woff2|webp)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
